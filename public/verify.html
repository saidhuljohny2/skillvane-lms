<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify SkillVane Certificate</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e8f1ff;font-family:Inter,Arial,sans-serif;padding:20px}.card{width:min(620px,100%);box-sizing:border-box;border:1px solid #24415f;border-radius:24px;background:#0b1726;padding:32px;box-shadow:0 30px 80px #0008}.mark{color:#f2b84b;font-weight:900;letter-spacing:.16em;font-size:12px}h1{font-size:30px;margin:10px 0}.box{margin-top:22px;border:1px solid #24415f;border-radius:16px;padding:20px;background:#08121f}.ok{color:#6ee7b7}.bad{color:#fca5a5}.row{padding:9px 0;border-bottom:1px solid #ffffff12}.row:last-child{border:0}a{color:#93c5fd}</style></head><body><main class="card"><div class="mark">SKILLVANE IT ACADEMY</div><h1>Certificate verification</h1><p id="status">Checking certificate…</p><div id="result" class="box"></div><p><a href="/">Return to SkillVane</a></p></main><script>const id=new URLSearchParams(location.search).get('id')||'';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));fetch('/api/certificate?id='+encodeURIComponent(id)).then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{document.getElementById('status').innerHTML=ok?'<b class="ok">✓ Valid SkillVane certificate</b>':'<b class="bad">Certificate not verified</b>';document.getElementById('result').innerHTML=ok?'<div class="row"><b>ID</b><br>'+esc(data.certificate.id)+'</div><div class="row"><b>Student</b><br>'+esc(data.certificate.student_name)+'</div><div class="row"><b>Course</b><br>'+esc(data.certificate.course_name)+'</div><div class="row"><b>Completion date</b><br>'+esc(data.certificate.completion_date)+'</div>':esc(data.error||'Certificate was not found.');}).catch(()=>{document.getElementById('status').innerHTML='<b class="bad">Verification unavailable</b>';});</script></body></html>
